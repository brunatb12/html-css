<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos em HTML5 </title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeio está hospedado no meu proprio servidor.</p>
    
    <video controls autoplay loop width="300" poster="imagem/limoes-capa.png" >
        <source src="midia/meu-video2.webm" type="video/webm">
        <source src="midia/meu-video1.mp4" type="video/mp4">
        <source src="midia/meu-video1.m4v" type="video/m4v">
        <source src="midia/meu-video1.ogv" type="video/ogg">
        <!--<video src="midia/meu-video1.m4v" width="500" controls></video>-->
        <!--windth=tamanho do video-->
        <p>Seu navegador não tem compatibilidade com a reproducção de video.</p>
    </video>
    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="300" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=MJk87gz8A3hwre40" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
