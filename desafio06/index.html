<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5,podemos inserir os elementos da lista a seguir. Passe o mouse osbre os termos para descobrir qual tag deverá utilizar em casa caso.</p>
    <ul type="square">
        <li><abbr title="Use a tag &lt; p &gt;">Parágrafo</abbr></li>
        <li><abbr title="Use a tag &lt; h1 &gt; até &lt; h6 &gt;">Título</abbr></li>
        <li><abbr title="Use a tag &lt; img &gt;">Imagens</abbr></li>
        <li><abbr title="Use a tag &lt; abbr &gt;">Abreviações</abbr></li>
        <li><abbr title="Use a tag &lt; code &gt;">Codigo-fonte</abbr></li>
        <li><abbr title="Use a tag &lt; ol &gt;">Listas Numericas</abbr></li>
        <li><abbr title="Use a tag &lt; ul &gt;">Listas com demarcação</abbr></li>
        
    </ul>
</body>
</html>
